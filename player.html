<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat&amp;family=Poppins:wght@300;400;500;600;700;800;900&amp;display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="home.css?v=2">
    <title>Music Player</title>
</head>

<body>
    <div class="container player-container">
        <a class="back-link" href="index.html" aria-label="Back to song selection">← Back</a>
        <h1 class="heading">Music Player</h1>
        <div class="music-container">
            <div id="cover-box">
                <img src="cover1.jpg" alt="cover-image" id="cover">
            </div>
            <div id="music-box">
                <audio id="disc" preload="auto"></audio>
                <div id="music-info">
                    <h2 id="title"></h2>
                    <h3 id="artist"></h3>
                    <div id="progress-container">
                        <div id="progress"></div>
                    </div>
                    <div id="timer-bar">
                        <span id="timer">0:00</span>
                        <span id="duration"></span>
                    </div>
                </div>
                <div id="control-box">
                    <button id="prev" class="btn" type="button" aria-label="Previous song">⏮</button>
                    <button id="play" class="special-btn" type="button" aria-label="Play">▶</button>
                    <button id="next" class="btn" type="button" aria-label="Next song">⏭</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js?v=2"></script>
</body>

</html>
